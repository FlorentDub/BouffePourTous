name: Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.check_suite.head_sha }}
  cancel-in-progress: true

jobs:
  merge:
    name: Fusion automatique
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Identifier la PR
        id: pr
        run: |
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ]; then
            SHA="${{ github.event.check_suite.head_sha }}"
            PR=$(gh pr list --repo "$REPO" --state open --json number,headRefOid --jq ".[] | select(.headRefOid == \"$SHA\") | .number" | head -n1)
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Attendre la fin des checks
        id: checks
        if: steps.pr.outputs.number != ''
        run: |
          PR="${{ steps.pr.outputs.number }}"
          OUT_OK=0
          for i in $(seq 1 40); do
            OUT=$(gh pr checks "$PR" --repo "$REPO" 2>/dev/null | grep -v "Fusion automatique" || true)
            if [ -n "$OUT" ] && ! echo "$OUT" | grep -qE "pending|queued|in_progress"; then
              if echo "$OUT" | grep -q "fail"; then
                OUT_OK=0
              else
                OUT_OK=1
              fi
              break
            fi
            sleep 15
          done
          echo "ok=$OUT_OK" >> "$GITHUB_OUTPUT"

      - name: Fusionner si tout est vert
        if: steps.pr.outputs.number != '' && steps.checks.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          PR="${{ steps.pr.outputs.number }}"
          DRAFT=$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq '.isDraft')
          if [ "$DRAFT" = "true" ]; then
            echo "PR brouillon, pas de fusion"
            exit 0
          fi
          MERGEABLE=$(gh pr view "$PR" --repo "$REPO" --json mergeable --jq '.mergeable')
          if [ "$MERGEABLE" != "MERGEABLE" ]; then
            echo "PR non fusionnable ($MERGEABLE), intervention manuelle requise"
            exit 0
          fi
          echo "Fusion de la PR #$PR"
          gh pr merge "$PR" --repo "$REPO" --merge
